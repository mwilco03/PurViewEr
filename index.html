function flattenObject(obj, prefix) {
  prefix = prefix || "";
  const result = {};
  for (const key of Object.keys(obj)) {
    const val = obj[key];
    const path = prefix ? prefix + "." + key : key;
    if (val && typeof val === "object" && !Array.isArray(val)) {
      Object.assign(result, flattenObject(val, path));
    } else if (Array.isArray(val)) {
      result[path] = JSON.stringify(val);
    } else {
      result[path] = val;
    }
  }
  return result;
}

function extractField(flatData, baseData, paths) {
  for (const p of paths) {
    const val = flatData[p] != null ? flatData[p] : baseData[p];
    if (val !== undefined && val !== null && val !== "") return String(val);
  }
  return "";
}

function cleanIp(raw) {
  if (!raw) return "";
  return raw.replace(/[\[\]]/g, "").split(":")[0] || raw;
}

function classifyIp(ip) {
  if (!ip) return IP_CLASS.UNKNOWN;
  if (PRIVATE_RANGE_TESTS.some(function(test) { return test(ip); })) return IP_CLASS.TRUSTED;
  return IP_CLASS.UNKNOWN;
}

function isMicrosoftIp(ip) {
  return KNOWN_MSFT_PREFIXES.some(function(p) { return ip.startsWith(p); });
}

function formatTime(isoStr) {
  if (!isoStr) return "";
  return isoStr.replace("T", " ").slice(0, 19);
}

function matchesIoc(record, iocSet) {
  if (iocSet.size === 0) return false;
  const fields = [record._clientIp, record._appId, record._clientAppId, record._operation, record._subject, record._user];
  return fields.some(function(f) { return f && iocSet.has(f.toLowerCase()); });
}

function processRecords(csvText, sourceFile) {
  sourceFile = sourceFile || "file";
  const parsed = Papa.parse(csvText, {
    header: true,
    skipEmptyLines: true,
    dynamicTyping: false,
    transformHeader: function(h) { return h.trim().replace(/^\uFEFF/, ""); },
  });

  if (parsed.errors.length > 0) {
    const fatal = parsed.errors.filter(function(e) {
      return e.type === "Delimiter" || e.type === "FieldMismatch";
    });
    if (fatal.length > 0 && parsed.data.length === 0) {
      throw new Error("CSV parse failed: " + fatal[0].message + " (row " + fatal[0].row + ")");
    }
  }

  const auditKey = (parsed.meta.fields || []).find(function(f) {
    return f.toLowerCase() === "auditdata";
  });
  const hasAuditData = !!auditKey;

  return parsed.data.map(function(row, i) {
    const auditRaw = hasAuditData ? (row[auditKey] || "") : "";
    let auditJson = null;
    let auditFlat = {};

    if (auditRaw) {
      try {
        auditJson = JSON.parse(auditRaw);
        auditFlat = flattenObject(auditJson);
      } catch(e1) {
        try {
          const cleaned = auditRaw.replace(/[\x00-\x1f]/g, " ").replace(/\\'/g, "'");
          auditJson = JSON.parse(cleaned);
          auditFlat = flattenObject(auditJson);
        } catch(e2) {
          // leave empty
        }
      }
    }

    const ip = cleanIp(extractField(auditFlat, row, FIELD_EXTRACTION.clientIp));

    return {
      _index: i,
      _source: sourceFile,
      _raw: auditRaw,
      _parseError: !auditJson && auditRaw.length > 0,
      _clientIp: ip,
      _isMsft: isMicrosoftIp(ip),
      _timestamp:        extractField(auditFlat, row, FIELD_EXTRACTION.timestamp),
      _operation:        extractField(auditFlat, row, FIELD_EXTRACTION.operation),
      _user:             extractField(auditFlat, row, FIELD_EXTRACTION.user),
      _subject:          extractField(auditFlat, row, FIELD_EXTRACTION.subject),
      _messageId:        extractField(auditFlat, row, FIELD_EXTRACTION.messageId),
      _path:             extractField(auditFlat, row, FIELD_EXTRACTION.path),
      _sessionId:        extractField(auditFlat, row, FIELD_EXTRACTION.sessionId),
      _appId:            extractField(auditFlat, row, FIELD_EXTRACTION.appId),
      _clientAppId:      extractField(auditFlat, row, FIELD_EXTRACTION.clientAppId),
      _externalAccess:   extractField(auditFlat, row, FIELD_EXTRACTION.externalAccess),
      _sizeInBytes:      extractField(auditFlat, row, FIELD_EXTRACTION.sizeInBytes),
      _logonType:        extractField(auditFlat, row, FIELD_EXTRACTION.logonType),
      _resultStatus:     extractField(auditFlat, row, FIELD_EXTRACTION.resultStatus),
      _workload:         extractField(auditFlat, row, FIELD_EXTRACTION.workload),
      _originatingServer:extractField(auditFlat, row, FIELD_EXTRACTION.originatingServer),
      _clientInfoString: extractField(auditFlat, row, FIELD_EXTRACTION.clientInfoString),
      _orgName:          extractField(auditFlat, row, FIELD_EXTRACTION.organizationName),
      _userType:         extractField(auditFlat, row, FIELD_EXTRACTION.userType),
      _recordType:       extractField(auditFlat, row, FIELD_EXTRACTION.recordType),
      _allFields: Object.assign({}, row, auditFlat),
    };
  });
}

function useDebounce(value, ms) {
  const [debounced, setDebounced] = useState(value);
  useEffect(function() {
    const timer = setTimeout(function() { setDebounced(value); }, ms);
    return function() { clearTimeout(timer); };
  }, [value, ms]);
  return debounced;
}

function bucketByMinute(records, ipMap) {
  const buckets = {};
  records.forEach(function(r) {
    if (!r._timestamp) return;
    const key = r._timestamp.slice(0, 16);
    if (!buckets[key]) {
      buckets[key] = { time: key };
      buckets[key][IP_CLASS.TRUSTED] = 0;
      buckets[key][IP_CLASS.SUSPICIOUS] = 0;
      buckets[key][IP_CLASS.UNKNOWN] = 0;
    }
    const cls = ipMap[r._clientIp] || IP_CLASS.UNKNOWN;
    buckets[key][cls]++;
  });
  return Object.values(buckets).sort(function(a, b) { return a.time.localeCompare(b.time); });
}

const INITIAL_FILTERS = Object.freeze({
  search: "", ipClass: "", operation: "", user: "", dateFrom: "", dateTo: "",
  iocMatchOnly: false, parseErrorsOnly: false,
});

const initialState = {
  records: [], ipMap: {}, view: VIEW.TIMELINE,
  filters: Object.assign({}, INITIAL_FILTERS),
  iocs: [], loading: false, error: null, fileNames: [],
};

function reducer(state, action) {
  switch (action.type) {
    case ACTION.SET_RECORDS:
      return Object.assign({}, state, { records: action.payload.records, fileNames: action.payload.fileNames, error: null });
    case ACTION.SET_IP_CLASS:
      var newMap = Object.assign({}, state.ipMap);
      newMap[action.payload.ip] = action.payload.cls;
      return Object.assign({}, state, { ipMap: newMap });
    case ACTION.SET_IP_MAP:
      return Object.assign({}, state, { ipMap: action.payload });
    case ACTION.SET_VIEW:
      return Object.assign({}, state, { view: action.payload });
    case ACTION.SET_FILTER:
      var newFilters = Object.assign({}, state.filters);
      newFilters[action.payload.key] = action.payload.value;
      return Object.assign({}, state, { filters: newFilters });
    case ACTION.CLEAR_FILTERS:
      return Object.assign({}, state, { filters: Object.assign({}, INITIAL_FILTERS) });
    case ACTION.SET_IOCS:
      return Object.assign({}, state, { iocs: action.payload });
    case ACTION.SET_LOADING:
      return Object.assign({}, state, { loading: action.payload });
    case ACTION.SET_ERROR:
      return Object.assign({}, state, { error: action.payload, loading: false });
    default: return state;
  }
}

function StatsBar({ records, filtered, ipMap, iocSet }) {

    const suspCount = filtered.filter(function(r) { return suspIps.has(r._clientIp); }).length;

    const msgs = new Set(filtered.filter(function(r) { return r._messageId; }).map(function(r) { return r._messageId; })).size;

function IpPanel({ ipMap, onClassify, records }) {
  const ipStats = useMemo(function() {
    const stats = {};
    records.forEach(function(r) {
      if (!r._clientIp) return;
      if (!stats[r._clientIp]) stats[r._clientIp] = { count: 0, isMsft: r._isMsft };
      stats[r._clientIp].count++;
    });
    var classOrder = {};
    classOrder[IP_CLASS.SUSPICIOUS] = 0;
    classOrder[IP_CLASS.UNKNOWN] = 1;
    classOrder[IP_CLASS.TRUSTED] = 2;
    return Object.entries(ipMap).map(function(e) {
      var ip = e[0], cls = e[1];
      var st = stats[ip] || { count: 0, isMsft: false };
      return { ip: ip, cls: cls, count: st.count, isMsft: st.isMsft };
    }).sort(function(a, b) {
      var d = classOrder[a.cls] - classOrder[b.cls];
      return d !== 0 ? d : b.count - a.count;
    });
  }, [ipMap, records]);

  return (
    <div style={S.card}>
      <div style={{ padding: "12px 16px", borderBottom: "1px solid #1e293b" }}>

              <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                <code style={{ fontSize: 11, fontFamily: MONO, color: "#cbd5e1", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 130, display: "block" }}>{item.ip}</code>

              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>

function Pagination({ page, pageCount, onPage }) {

    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 8, paddingTop: 8, borderTop: "1px solid #1e293b" }}>
      <button onClick={function() { onPage(Math.max(0, page - 1)); }} disabled={page === 0} style={Object.assign({}, S.btn(false), { opacity: page === 0 ? 0.3 : 1 })}>&larr; Prev</button>
      <span style={{ fontSize: 11, fontFamily: MONO, color: "#64748b" }}>Page {page + 1} / {pageCount}</span>
      <button onClick={function() { onPage(Math.min(pageCount - 1, page + 1)); }} disabled={page >= pageCount - 1} style={Object.assign({}, S.btn(false), { opacity: page >= pageCount - 1 ? 0.3 : 1 })}>Next &rarr;</button>

  );
}

function GroupedView({ records, ipMap, iocSet, groupKey, labelKey, extraInfo }) {
  const [expanded, setExpanded] = useState(new Set());
  const groups = useMemo(function() {
    var map = {};
    records.forEach(function(r) {
      var key = r[groupKey] || "(empty)";
      if (!map[key]) map[key] = { key: key, label: r[labelKey] || key, records: [], extra: extraInfo ? extraInfo(r) : null };
      map[key].records.push(r);
    });
    return Object.values(map).sort(function(a, b) { return b.records.length - a.records.length; });
  }, [records, groupKey, labelKey, extraInfo]);

  var toggle = function(key) {
    setExpanded(function(prev) {
      var next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      {groups.map(function(g) {
        var suspCount = g.records.filter(function(r) { return ipMap[r._clientIp] === IP_CLASS.SUSPICIOUS; }).length;
        var isOpen = expanded.has(g.key);
        var uniqueIps = [... new Set(g.records.map(function(r) { return r._clientIp; }))];
        var timeRange = g.records.length > 0
          ? formatTime(g.records[g.records.length - 1]._timestamp) + " \u2192 " + formatTime(g.records[0]._timestamp) : "";

        return (
          <div key={g.key} style={S.card}>
            <button onClick={function() { toggle(g.key); }} style={S.groupHeader}
              onMouseEnter={function(e) { e.currentTarget.style.background = "rgba(30,41,59,0.13)"; }}
              onMouseLeave={function(e) { e.currentTarget.style.background = "transparent"; }}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flex: 1 }}>
                <span style={{ fontSize: 10, color: "#64748b" }}>{isOpen ? "\u25BC" : "\u25B6"}</span>
                <div style={{ minWidth: 0 }}>
                  <div style={Object.assign({ fontSize: 13, fontWeight: 600, fontFamily: MONO }, S.truncate)}>{g.label}</div>
                  {g.extra && <div style={Object.assign({ fontSize: 10, color: "#64748b" }, S.truncate)}>{g.extra}</div>}
                  {groupKey === "_sessionId" && <div style={{ fontSize: 10, color: "#475569" }}>{timeRange}</div>}
                </div>
                {groupKey === "_clientIp" && (
                  <div style={{ marginLeft: 4, display: "flex", alignItems: "center", gap: 4 }}>
                    <Badge cls={ipMap[g.key] || IP_CLASS.UNKNOWN} />
                    {isMicrosoftIp(g.key) && <MsftTag />}
                  </div>
                )}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                {suspCount > 0 && <span style={Object.assign({}, S.tag, { background: "#450a0a", color: "#fca5a5" })}>{suspCount} suspicious</span>}
                <span style={{ fontSize: 11, fontFamily: MONO, color: "#64748b" }}>{g.records.length} events</span>
                {groupKey !== "_clientIp" && <span style={{ fontSize: 11, fontFamily: MONO, color: "#475569" }}>{uniqueIps.length} IPs</span>}
              </div>
            </button>
            {isOpen && (
              <div style={{ borderTop: "1px solid #1e293b", padding: "4px 8px 8px", maxHeight: 400, overflowY: "auto" }}>
                {g.records.map(function(r) { return <RecordRow key={r._index} r={r} ipMap={ipMap} iocSet={iocSet} />; })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

      "operation","user","subject","message_id","path","session_id",
      "app_id","client_app_id","external_access","size_bytes",
      "logon_type","result_status","workload","client_info","source_file",
    ];
    var rows = records.map(function(r) {
      return {
        timestamp: r._timestamp, ip: r._clientIp,
        ip_classification: ipMap[r._clientIp] || IP_CLASS.UNKNOWN,
        is_microsoft_ip: r._isMsft, ioc_match: matchesIoc(r, iocSet),
        operation: r._operation, user: r._user, subject: r._subject,
        message_id: r._messageId, path: r._path, session_id: r._sessionId,
        app_id: r._appId, client_app_id: r._clientAppId,
        external_access: r._externalAccess, size_bytes: r._sizeInBytes,
        logon_type: r._logonType, result_status: r._resultStatus,
        workload: r._workload, client_info: r._clientInfoString,
        source_file: r._source,
      };
    });
    var csv = Papa.unparse(rows, { columns: exportFields });
    var blob = new Blob([csv], { type: "text/csv" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "purview-forensic-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    URL.revokeObjectURL(url);
  };
  return <button onClick={handleExport} style={S.btnPrimary}>Export Filtered CSV</button>;
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// MAIN APP
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const fileRef = useRef();

  const iocSet = useMemo(function() {
    return new Set(state.iocs.map(function(s) { return s.toLowerCase(); }));
  }, [state.iocs]);

  // Load persisted on mount
  useEffect(function() {
    var savedIpMap = loadPersistedIpMap();
    if (savedIpMap) dispatch({ type: ACTION.SET_IP_MAP, payload: savedIpMap });
    var savedIocs = loadPersistedIocs();
    if (savedIocs) dispatch({ type: ACTION.SET_IOCS, payload: savedIocs });
  }, []);

  // Persist IP map
  useEffect(function() {
    if (Object.keys(state.ipMap).length > 0) persistIpMap(state.ipMap);
  }, [state.ipMap]);

  var handleClassify = useCallback(function(ip, cls) {
    dispatch({ type: ACTION.SET_IP_CLASS, payload: { ip: ip, cls: cls } });
  }, []);

  var handleSetIocs = useCallback(function(items) {
    dispatch({ type: ACTION.SET_IOCS, payload: items });
    persistIocs(items);
    // Auto-flag IOC IPs
    var lower = new Set(items.map(function(s) { return s.toLowerCase(); }));
    var updates = Object.assign({}, state.ipMap);
    var changed = false;
    Object.keys(updates).forEach(function(ip) {
      if (lower.has(ip.toLowerCase()) && updates[ip] !== IP_CLASS.SUSPICIOUS) {
        updates[ip] = IP_CLASS.SUSPICIOUS;
        changed = true;
      }
    });
    if (changed) dispatch({ type: ACTION.SET_IP_MAP, payload: updates });
  }, [state.ipMap]);

  var handleFile = useCallback(function(files, append) {
    if (!files || files.length === 0) return;
    dispatch({ type: ACTION.SET_LOADING, payload: true });

    var processAll = async function() {
      try {
        var allRecords = append ? state.records.slice() : [];
        var allFileNames = append ? state.fileNames.slice() : [];

        for (var fi = 0; fi < files.length; fi++) {
          var text = await files[fi].text();
          var recs = processRecords(text, files[fi].name);
          if (recs.length === 0) throw new Error("No records found in " + files[fi].name);
          var offset = allRecords.length;
          recs.forEach(function(r, i) { r._index = offset + i; });
          allRecords = allRecords.concat(recs);
          allFileNames.push(files[fi].name);
        }

        dispatch({ type: ACTION.SET_RECORDS, payload: { records: allRecords, fileNames: allFileNames } });

        var newIpMap = Object.assign({}, state.ipMap);
        allRecords.forEach(function(r) {
          if (r._clientIp && !newIpMap[r._clientIp]) {
            newIpMap[r._clientIp] = classifyIp(r._clientIp);
          }
        });
        state.iocs.forEach(function(ioc) {
          var l = ioc.toLowerCase();
          Object.keys(newIpMap).forEach(function(ip) {
            if (ip.toLowerCase() === l) newIpMap[ip] = IP_CLASS.SUSPICIOUS;
          });
        });
        dispatch({ type: ACTION.SET_IP_MAP, payload: newIpMap });
        dispatch({ type: ACTION.SET_LOADING, payload: false });
      } catch(err) {
        dispatch({ type: ACTION.SET_ERROR, payload: err.message });
      }
    };
    processAll();
  }, [state.records, state.fileNames, state.ipMap, state.iocs]);

  var handleDrop = useCallback(function(e) {
    e.preventDefault();
    e.stopPropagation();
    var files = Array.from(e.dataTransfer.files);
    if (files.length > 0) handleFile(files, state.records.length > 0);
  }, [handleFile, state.records.length]);

  var handleInputChange = useCallback(function(e) {
    var files = Array.from(e.target.files);
    handleFile(files, state.records.length > 0);
    e.target.value = "";
  }, [handleFile, state.records.length]);

  var debouncedSearch = useDebounce(state.filters.search, DEBOUNCE_MS);

  var uniqueOps = useMemo(function() { return [... new Set(state.records.map(function(r) { return r._operation; }))].filter(Boolean).sort(); }, [state.records]);
  var uniqueUsers = useMemo(function() { return [... new Set(state.records.map(function(r) { return r._user; }))].filter(Boolean).sort(); }, [state.records]);

  var filtered = useMemo(function() {
    var search = debouncedSearch.toLowerCase();
    return state.records.filter(function(r) {
      if (search) {
        var haystack = [r._clientIp, r._user, r._subject, r._messageId, r._operation, r._path, r._sessionId, r._appId, r._clientAppId].join(" ").toLowerCase();
        if (haystack.indexOf(search) === -1) return false;
      }
      if (state.filters.ipClass && (state.ipMap[r._clientIp] || IP_CLASS.UNKNOWN) !== state.filters.ipClass) return false;
      if (state.filters.operation && r._operation !== state.filters.operation) return false;
      if (state.filters.user && r._user !== state.filters.user) return false;
      if (state.filters.dateFrom) {
        var ts = new Date(r._timestamp).getTime();
        if (isNaN(ts) || ts < new Date(state.filters.dateFrom).getTime()) return false;
      }
      if (state.filters.dateTo) {
        var ts2 = new Date(r._timestamp).getTime();
        if (isNaN(ts2) || ts2 > new Date(state.filters.dateTo).getTime()) return false;
      }
      if (state.filters.iocMatchOnly && !matchesIoc(r, iocSet)) return false;
      if (state.filters.parseErrorsOnly && !r._parseError) return false;
      return true;
    });
  }, [state.records, debouncedSearch, state.filters, state.ipMap, iocSet]);

  // â”€â”€â”€ Empty state â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  if (state.records.length === 0) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: 20 }}
        onDragOver={function(e) { e.preventDefault(); e.stopPropagation(); }}
        onDrop={handleDrop}>
        <div style={{ maxWidth: 520, width: "100%", textAlign: "center" }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#ef4444", letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: 8 }}>FORENSIC TOOL</div>
          <h1 style={{ fontSize: 28, fontWeight: 800, color: "#f8fafc", marginBottom: 8, letterSpacing: "-0.03em" }}>Purview Audit Log Analyzer</h1>
          <p style={{ fontSize: 13, color: "#64748b", marginBottom: 32, lineHeight: 1.6 }}>
            Parse, classify, and investigate Microsoft Purview audit log exports.
            All processing happens locally in your browser. Your data never leaves this page.
          </p>
          <label style={{ border: "2px dashed #334155", borderRadius: 16, padding: "60px 40px", textAlign: "center", cursor: "pointer", display: "block", background: "#12151c", transition: "all 0.2s" }}
            onMouseEnter={function(e) { e.currentTarget.style.borderColor = "#3b82f6"; e.currentTarget.style.background = "#0f172a"; }}
            onMouseLeave={function(e) { e.currentTarget.style.borderColor = "#334155"; e.currentTarget.style.background = "#12151c"; }}>
            <div style={{ fontSize: 36, marginBottom: 12 }}>&#x1F4C2;</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: "#e2e8f0", marginBottom: 4 }}>Drop CSV files here or click to browse</div>
            <div style={{ fontSize: 11, color: "#475569" }}>Supports Purview audit log exports. Multiple files merge automatically.</div>
            <input ref={fileRef} type="file" accept=".csv" multiple onChange={handleInputChange} style={{ display: "none" }} />
          </label>
          {state.loading && <div style={{ marginTop: 16, color: "#60a5fa", fontSize: 13 }}>Parsing records...</div>}
          {state.error && <div style={Object.assign({}, S.errorBanner, { margin: "16px 0" })}>{state.error}</div>}
          <div style={{ marginTop: 32, fontSize: 11, color: "#334155", lineHeight: 1.8 }}>
            <div>Powered by PapaParse | IP classifications and IOCs persist in localStorage</div>
          </div>
        </div>
      </div>
    );
  }

  // â”€â”€â”€ Main UI â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  var viewContent = {};
  viewContent[VIEW.TIMELINE] = <TimelineView records={filtered} ipMap={state.ipMap} iocSet={iocSet} />;
  viewContent[VIEW.BY_IP] = <GroupedView records={filtered} ipMap={state.ipMap} iocSet={iocSet} groupKey="_clientIp" labelKey="_clientIp" />;
  viewContent[VIEW.BY_USER] = <GroupedView records={filtered} ipMap={state.ipMap} iocSet={iocSet} groupKey="_user" labelKey="_user" />;
  viewContent[VIEW.BY_MESSAGE] = <GroupedView records={filtered} ipMap={state.ipMap} iocSet={iocSet} groupKey="_messageId" labelKey="_subject" extraInfo={function(r) { return r._subject; }} />;
  viewContent[VIEW.BY_OPERATION] = <GroupedView records={filtered} ipMap={state.ipMap} iocSet={iocSet} groupKey="_operation" labelKey="_operation" />;
  viewContent[VIEW.BY_SESSION] = <GroupedView records={filtered} ipMap={state.ipMap} iocSet={iocSet} groupKey="_sessionId" labelKey="_sessionId" extraInfo={function(r) { return r._user + " via " + r._clientIp; }} />;
  viewContent[VIEW.RAW] = <RawView records={filtered} />;

  var parseErrors = state.records.filter(function(r) { return r._parseError; }).length;

  return (
    <ErrorBoundary>
      {/* Header */}
      <div style={S.header}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 12, fontWeight: 800, color: "#ef4444", letterSpacing: "0.1em" }}>FORENSIC</span>
          <div>
            <div style={{ fontSize: 16, fontWeight: 700, color: "#f8fafc", letterSpacing: "-0.02em" }}>Purview Audit Analyzer</div>
            <div style={{ fontSize: 11, color: "#64748b", marginTop: 1 }}>
              {state.records.length} records from {state.fileNames.length} file(s)
              {parseErrors > 0 && <span style={{ color: "#fbbf24" }}> | {parseErrors} parse errors</span>}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <ExportButton records={filtered} ipMap={state.ipMap} iocSet={iocSet} />
          <label style={Object.assign({}, S.btn(false), { cursor: "pointer", display: "inline-block" })}>
            + Add Files
            <input type="file" accept=".csv" multiple onChange={handleInputChange} style={{ display: "none" }} />
          </label>
        </div>
      </div>

      {state.error && <div style={S.errorBanner}>{state.error}</div>}

      <div style={{ display: "flex", gap: 16, padding: "16px 20px", alignItems: "flex-start" }}>
        {/* Sidebar */}
        <div style={{ width: 280, flexShrink: 0, display: "flex", flexDirection: "column", gap: 12 }}>
          <IpPanel ipMap={state.ipMap} onClassify={handleClassify} records={state.records} />
          <IocPanel iocs={state.iocs} onSetIocs={handleSetIocs} />
        </div>

        {/* Main */}
        <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", gap: 12 }}>
          <StatsBar records={state.records} filtered={filtered} ipMap={state.ipMap} iocSet={iocSet} />
          <ActivityChart records={filtered} ipMap={state.ipMap} />

          <div style={Object.assign({}, S.card, { padding: "10px 14px" })}>
            <FilterBar filters={state.filters} dispatch={dispatch} uniqueOps={uniqueOps} uniqueUsers={uniqueUsers} />
          </div>

          {/* View tabs */}
          <div style={{ display: "flex", gap: 2, background: "#161a23", borderRadius: 10, border: "1px solid #1e293b", padding: 3 }}>
            {Object.entries(VIEW_META).map(function(entry) {
              var key = entry[0], meta = entry[1];
              return (
                <button key={key} onClick={function() { dispatch({ type: ACTION.SET_VIEW, payload: key }); }}
                  style={Object.assign({}, S.btn(state.view === key), { display: "flex", alignItems: "center", gap: 4, borderRadius: 8, flex: 1, justifyContent: "center" })}>
                  <span>{meta.icon}</span>
                  <span>{meta.label}</span>
                </button>
              );
            })}
          </div>

          <div style={{ fontSize: 11, color: "#475569" }}>{filtered.length} of {state.records.length} records</div>

          {viewContent[state.view]}
        </div>
      </div>
    </ErrorBoundary>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch(e) {
  document.getElementById("root").innerHTML = '<pre style="color:red;padding:20px">RENDER ERROR: ' + e.message + '\n\n' + e.stack + '</pre>';
}
</script>
</body>
